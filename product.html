<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f85606"><link rel="stylesheet" href="style.css"><title>Product</title></head><body><div class="wrap" id="p">Loading...</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script><script src="config.js"></script><script src="app.js"></script>
<script>
head();let P,sz='',cl='';
(async()=>{const id=new URLSearchParams(location.search).get('id');
const{data}=await sb.from('products').select('*').eq('id',id).single();P=data;if(!P)return $('#p').textContent='Product nahi mila';
document.title=P.title;const n=P.images.length;
const opt=(s,k)=>s?'<p><b>'+k+' chunein</b></p><div class="opt" data-k="'+k+'">'+s.split(',').map(x=>'<button>'+esc(x.trim())+'</button>').join('')+'</div>':'';
$('#p').innerHTML='<div class="car" id="car">'+P.images.map(i=>'<img src="'+esc(i)+'" alt="">').join('')+'</div>'+(n>1?'<div class="dots" id="dt">1 / '+n+'</div><div class="th">'+P.images.map((i,x)=>'<img src="'+esc(i)+'" onclick="car.scrollTo({left:'+x+'*car.clientWidth,behavior:\'smooth\'})">').join('')+'</div>':'')+
'<div class="box"><h2>'+esc(P.title)+'</h2><div class="price">'+rs(P.price)+'</div><div class="pt"><span>💵 Cash on Delivery</span>'+(CFG.SHIP==0?'<span>🚚 Free Delivery</span>':'')+(CFG.DELIVERY?'<span>⏱️ Delivery '+esc(CFG.DELIVERY)+'</span>':'')+'</div>'+opt(P.sizes,'Size')+opt(P.colors,'Colour')+'<p><b>Quantity</b></p><input id="qt" type="number" value="1" min="1"><p>'+esc(P.descr).replace(/\n/g,'<br>')+'</p><button class="btn" onclick="add(0)">🛒 Cart mein daalein</button></div><h3 id="rt" style="display:none">Aap ko ye bhi pasand aayega</h3><div class="grid" id="rel"></div>';
document.body.insertAdjacentHTML('beforeend','<div class="bar"><div><small>Price</small><b>'+rs(P.price)+'</b></div><button class="btn" onclick="add(1)">Abhi Order Karein</button></div>');
car.onscroll=()=>{const d=$('#dt');if(d)d.textContent=(Math.round(car.scrollLeft/car.clientWidth)+1)+' / '+n};
document.querySelectorAll('.opt').forEach(d=>d.onclick=e=>{if(e.target.tagName!='BUTTON')return;d.querySelectorAll('button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');if(d.dataset.k=='Size')sz=e.target.textContent;else cl=e.target.textContent});
const r=await sb.from('products').select('*').eq('active',true).neq('id',P.id).limit(4);
if(r.data&&r.data.length){$('#rt').style.display='block';$('#rel').innerHTML=r.data.map(p=>'<a class="card" href="product.html?id='+p.id+'"><div class="im"><img src="'+esc(p.images[0])+'" loading="lazy" alt=""></div><div class="in"><div class="t">'+esc(p.title)+'</div><b>'+rs(p.price)+'</b></div></a>').join('')}
})();
function add(go){if(P.sizes&&!sz)return alert('Pehle size chunein');if(P.colors&&!cl)return alert('Pehle colour chunein');
const c=cart();c.push({id:P.id,title:P.title,img:P.images[0],price:P.price,cost:P.cost,size:sz,color:cl,q:+$('#qt').value||1});save(c);go?location='cart.html':alert('Cart mein add ho gaya ✅')}
</script></body></html>
