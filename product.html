<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f85606"><link rel="stylesheet" href="style.css"><title>Product</title></head><body><div class="wrap" id="p">Loading...</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script><script src="config.js"></script><script src="app.js"></script>
<script>
head();let P,sz='',cl='';
(async()=>{const id=new URLSearchParams(location.search).get('id');
const{data}=await sb.from('products').select('*').eq('id',id).single();P=data;if(!P)return $('#p').textContent='Product nahi mila';
document.title=P.title;{const r=JSON.parse(localStorage.rvw||'[]').filter(x=>x!=P.id);r.unshift(P.id);localStorage.rvw=JSON.stringify(r.slice(0,8))}ev('ViewContent',{value:P.price,currency:'PKR'});const n=P.images.length;
const opt=(s,k)=>s?'<p><b>'+k+' chunein</b></p><div class="opt" data-k="'+k+'">'+s.split(',').map(x=>'<button>'+esc(x.trim())+'</button>').join('')+'</div>':'';
$('#p').innerHTML='<a class="bk" href="javascript:history.length>1?history.back():location=\'index.html\'">← Wapas</a><div class="car" id="car">'+P.images.map(i=>'<img src="'+esc(i)+'" alt="">').join('')+'</div>'+(n>1?'<div class="dots" id="dt">1 / '+n+'</div><div class="th">'+P.images.map((i,x)=>'<img src="'+esc(i)+'" onclick="car.scrollTo({left:'+x+'*car.clientWidth,behavior:\'smooth\'})">').join('')+'</div>':'')+
'<div class="box">'+(P.badge?'<span class="bdg s">'+esc(P.badge)+'</span>':'')+'<h2>'+esc(P.title)+'</h2><div id="stz"></div><div class="price">'+rs(P.price)+'</div><div class="pt"><span>💵 Cash on Delivery</span>'+(CFG.SHIP==0?'<span>🚚 Free Delivery</span>':'')+(CFG.DELIVERY?'<span>⏱️ Delivery '+esc(CFG.DELIVERY)+'</span>':'')+'</div>'+opt(P.sizes,'Size')+opt(P.colors,'Colour')+'<p><b>Quantity</b></p><input id="qt" type="number" value="1" min="1"><div class="ds">'+dsc(P.descr)+'</div>'+(P.soldout?'<div class="sdb">😔 Ye product abhi khatam hai</div>':'<button class="btn" onclick="add(0)">🛒 Cart mein daalein</button>')+'<div class="row2"><button class="btn g" onclick="share()">📤 Share</button>'+(CFG.WA?'<a class="btn g" target="_blank" href="https://wa.me/'+esc(CFG.WA)+'?text='+encodeURIComponent('Assalam o Alaikum! Mujhe is product ke baare mein poochna hai: '+P.title+' '+location.href)+'">💬 Poochein</a>':'')+'</div></div><div id="rv"></div><h3 id="rt" style="display:none">Aap ko ye bhi pasand aayega</h3><div class="grid" id="rel"></div>';
document.body.insertAdjacentHTML('beforeend','<div class="bar"><div><small>Price</small><b>'+rs(P.price)+'</b></div><button class="btn" '+(P.soldout?'disabled':'onclick="add(1)"')+'>'+(P.soldout?'Sold Out':'Abhi Order Karein')+'</button></div>');
car.onclick=e=>{if(e.target.tagName=='IMG')lb(e.target.src)};
car.onscroll=()=>{const d=$('#dt');if(d)d.textContent=(Math.round(car.scrollLeft/car.clientWidth)+1)+' / '+n};
document.querySelectorAll('.opt').forEach(d=>d.onclick=e=>{if(e.target.tagName!='BUTTON')return;d.querySelectorAll('button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');if(d.dataset.k=='Size')sz=e.target.textContent;else cl=e.target.textContent});
loadRv();
const r=await sb.from('products').select('*').eq('active',true).neq('id',P.id).limit(4);
if(r.data&&r.data.length){$('#rt').style.display='block';$('#rel').innerHTML=r.data.map(p=>'<a class="card" href="product.html?id='+p.id+'"><div class="im"><img src="'+esc(p.images[0])+'" loading="lazy" alt=""></div><div class="in"><div class="t">'+esc(p.title)+'</div><b>'+rs(p.price)+'</b></div></a>').join('')}
})();
async function loadRv(){const r=await sb.from('reviews').select('*').eq('product_id',P.id).eq('approved',true).order('id',{ascending:false});const L=(r&&r.data)||[];
if(L.length){const av=L.reduce((a,x)=>a+x.stars,0)/L.length;$('#stz').innerHTML='<div class="stars">'+'⭐'.repeat(Math.round(av))+' <small>'+av.toFixed(1)+' ('+L.length+' reviews)</small></div>'}
$('#rv').innerHTML='<div class="box"><h3>⭐ Customer Reviews</h3>'+(L.map(x=>'<div class="rev"><b>'+'⭐'.repeat(x.stars)+'</b> '+esc(x.name)+'<br>'+esc(x.body)+'</div>').join('')||'<p>Abhi koi review nahi.</p>')+'<details><summary>✍️ Review likhein</summary><input id="rn" placeholder="Aap ka naam"><select id="rs"><option value="5">⭐⭐⭐⭐⭐ (5)</option><option value="4">⭐⭐⭐⭐ (4)</option><option value="3">⭐⭐⭐ (3)</option><option value="2">⭐⭐ (2)</option><option value="1">⭐ (1)</option></select><textarea id="rb" maxlength="500" placeholder="Apna tajurba likhein"></textarea><button class="btn" onclick="sendRv()">Review bhejein</button><small>Review admin ki manzoori ke baad dikhega.</small></details></div>'}
async function sendRv(){const n=$('#rn').value.trim(),b=$('#rb').value.trim();if(n.length<2||b.length<5)return alert('Naam aur review likhein');
const t=JSON.parse(localStorage.rt||'[]').filter(x=>Date.now()-x<864e5);if(t.length>=3)return alert('Aaj ke liye bohat reviews ho chuke hain');
const{error}=await sb.from('reviews').insert({product_id:P.id,name:n,stars:+$('#rs').value,body:b});if(error)return alert('Review nahi gaya. Baad mein koshish karein.');
t.push(Date.now());localStorage.rt=JSON.stringify(t);$('#rv').querySelector('details').innerHTML='<p>✅ Shukriya! Aap ka review admin ki manzoori ke baad dikhega.</p>'}
function lb(u){document.body.insertAdjacentHTML('beforeend','<div class="lb" onclick="this.remove()"><img src="'+esc(u)+'"><span>✕</span></div>')}
const dsc=s=>String(s||'').split('\n').map(l=>{const m=l.match(/^• ([^:]{1,32}): (.+)$/);return m?'<div class="sp"><span>'+esc(m[1])+'</span><b>'+esc(m[2])+'</b></div>':esc(l)+'<br>'}).join('');
function share(){const u=location.href,t=P.title+' - '+rs(P.price);if(navigator.share)navigator.share({title:t,url:u}).catch(()=>{});else open('https://wa.me/?text='+encodeURIComponent(t+' '+u))}
function add(go){if(P.soldout)return alert('Ye product abhi khatam hai');if(P.sizes&&!sz)return alert('Pehle size chunein');if(P.colors&&!cl)return alert('Pehle colour chunein');
const c=cart();c.push({id:P.id,title:P.title,img:P.images[0],price:P.price,cost:P.cost,size:sz,color:cl,q:+$('#qt').value||1});save(c);ev('AddToCart',{value:P.price*(+$('#qt').value||1),currency:'PKR'});go?location='cart.html':alert('Cart mein add ho gaya ✅')}
</script></body></html>
