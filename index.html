<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f85606"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>Store</title></head><body><div class="wrap">
<div id="cr"></div><div class="hero"><h2>Naya Collection 🔥</h2><p>Pasandeeda cheezein, ghar baithe mangwayein</p></div>
<div class="trust" id="tr"></div>
<div class="sb"><input id="q" placeholder="🔍 Search ya bol kar dhoondein..."><button type="button" id="ml" aria-label="Zabaan">اردو</button><button type="button" id="mic" aria-label="Awaaz se search">🎤</button></div>
<div class="sg">Try karein: <a data-s="ring">💍 ring</a><a data-s="wallet">👛 wallet</a><a data-s="jootay">👟 jootay</a><a data-s="ghari">⌚ ghari</a><a data-s="sasta">💸 sasta</a></div>
<div class="chips" id="chips"></div>
<div class="sortbar"><select id="so"><option value="n">Naya pehle</option><option value="l">Sasta pehle</option><option value="h">Mehnga pehle</option></select><select id="pb"><option value="">Har price</option><option value="0-1000">Rs 1,000 tak</option><option value="1000-2000">1,000 - 2,000</option><option value="2000-3000">2,000 - 3,000</option><option value="3000-999999">3,000 se upar</option></select></div>
<div id="fr"></div><div id="rc"></div>
<h3 id="ct"></h3>
<div class="grid" id="g"></div>
<div class="how"><h3>🛍️ Order kaise karein?</h3><div class="steps"><div><b>1</b><span>Product chunein</span></div><div><b>2</b><span>Naam aur address likhein</span></div><div><b>3</b><span>Ghar par paise dein (COD)</span></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script><script src="config.js"></script><script src="app.js"></script>
<script>
window.onS=S=>{if(+S.bundle_n&&+S.bundle_off)$('#tr').insertAdjacentHTML('beforeend','<span>🎁 '+S.bundle_n+' lo, Rs '+S.bundle_off+' bachao</span>');if(S.hero_t)$('.hero h2').textContent=S.hero_t;if(S.hero_p)$('.hero p').textContent=S.hero_p};
head();let all=[],cat='';
const EM={jewellery:'💍',shoes:'👟',accessories:'👜','winter wear':'🧥',watches:'⌚',kitchen:'🍳',beauty:'💄',electronics:'🎧',home:'🏠'};
let NW=new Set();const bd=p=>p.badge||(NW.has(p.id)?'Naya':'');
const em=c=>EM[String(c).toLowerCase()]||'🛍️';
$('#tr').innerHTML='<span>'+(CFG.SHIP==0?'🚚 Free Delivery':'🚚 '+rs(CFG.FREE)+' se upar free delivery')+'</span><span>💵 Cash on Delivery</span><span>✅ Asaan Order</span>';
$('#g').innerHTML='<div class="card sk"><div class="im"></div><div class="in"><div class="t"></div></div></div>'.repeat(4);
(async()=>{const{data}=await sb.from('products').select('*').eq('active',true).order('id',{ascending:false});all=data||[];NW=new Set([...all].filter(p=>p.created_at&&Date.now()-new Date(p.created_at)<7*864e5).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,3).map(p=>p.id));
const cs=[...new Set(all.map(p=>p.category).filter(Boolean))];
$('#chips').innerHTML=['All',...cs,'❤'].map(c=>'<button data-c="'+esc(c)+'">'+(c=='All'?'🔥 All':c=='❤'?'❤️ Pasandeeda':em(c)+' '+esc(c))+'</button>').join('');show()})();
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c=='All'?'':b.dataset.c;show()};
$('#q').oninput=show;$('#so').onchange=show;$('#pb').onchange=show;
$('#g').onclick=e=>{const h=e.target.closest('.hrt');if(!h)return;e.preventDefault();const on=tw(+h.dataset.id);h.classList.toggle('on',on);h.textContent=on?'❤️':'🤍';if(cat=='❤')show()};
const SW=new Set('ka ki ke chahiye chahiyen dikhao dikhayen dikha mujhe mere sab se mein wali wala wale hai aur ya for the a an kuch koi کا کی کے چاہیے چاہیئے دکھاؤ دکھائیں مجھے سب سے میں والی والا والے ہے اور یا کچھ کوئی'.split(' '));
const SORTW={};'sasta sasti sastay sastey سستا سستی سستے'.split(' ').forEach(w=>SORTW[w]='l');'mehnga mehngi mehngay مہنگا مہنگی مہنگے'.split(' ').forEach(w=>SORTW[w]='h');'naya nayi naye نیا نئی نئے'.split(' ').forEach(w=>SORTW[w]='n');
const LX={};const adl=(k,v)=>k.split(' ').forEach(w=>LX[w]=v);
adl('انگوٹھی انگوٹھیاں انگوٹھیوں angoothi anguthi angoothiyan ring rings',['ring']);
adl('ہار نیکلس لاکٹ پینڈنٹ haar necklace locket pendant',['necklace','pendant']);
adl('بٹوہ والٹ پرس batua wallet purse',['wallet']);
adl('جوتے جوتا جوتی بوٹ بوٹس شوز سینڈل چپل jootay joote joota jootey boot boots shoe shoes sandal sandals chappal',['shoe','boot','sandal','clog']);
adl('گھڑی گھڑیاں واچ ghari gharian watch watches',['watch']);
adl('ہوڈی ہوڈیز سویٹر جرسی گرم سردی ٹریک سوٹ hoodie hoodies sweater jersey garam sardi winter tracksuit',['hoodie','winter','fleece','track']);
adl('زیور زیورات جیولری zewar zevar jewellery jewelry jewel',['jewel','ring','necklace','pendant']);
adl('تحفہ تحفے گفٹ tohfa tohfay gift gifts',['gift','couple','wallet','ring']);
adl('جوڑا کپل couple jora',['couple']);
adl('مردانہ مردوں مرد men mens gents mardana',['men']);
adl('زنانہ خواتین عورتوں لیڈیز women ladies zanana',['women','ladies','female']);
adl('ایکسیسریز accessories',['accessor','wallet']);
adl('کپڑے کپڑا کپڑوں kapray kapre kapra kapdon clothes',['hoodie','track','suit','fleece','winter']);
function parseQ(s){const g=[];let sort='';String(s).toLowerCase().replace(/[.,!?"'’“”()\-_/]/g,' ').split(/\s+/).filter(Boolean).forEach(w=>{if(SW.has(w))return;if(SORTW[w]){sort=SORTW[w];return}if(LX[w]){g.push(LX[w]);return}if(/[^\x00-\x7F]/.test(w))return;g.push([w])});return{g,sort}}
const rx=t=>new RegExp('\\b'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
const hs=p=>p.title+' '+(p.category||'')+' '+(p.descr||'')+' '+(p.badge||'');
function mq(p,g){const h=hs(p);return g.every(a=>a.some(t=>rx(t).test(h)))}
function qf(L,g){if(!g.length)return L;const f=L.filter(p=>mq(p,g));if(f.length)return f;const sc=p=>g.filter(a=>a.some(t=>rx(t).test(hs(p)))).length;return L.filter(p=>sc(p)>0).sort((a,b)=>sc(b)-sc(a))}
let LG='ur-PK',vc=null;
if(!SRC){$('#mic').style.display='none';$('#ml').style.display='none'}
$('#ml').onclick=()=>{LG=LG=='ur-PK'?'en-IN':'ur-PK';$('#ml').textContent=LG=='ur-PK'?'اردو':'EN'};
const MP='🔍 Search ya bol kar dhoondein...',mend=()=>{vc=null;$('#mic').classList.remove('on');$('#q').placeholder=MP};
$('#mic').onclick=()=>{if(vc){vc.stop();return}$('#mic').classList.add('on');$('#q').placeholder='🎙️ Boliye...';
vc=voice({lang:LG,onInterim:t=>{$('#q').value=t;show()},onFinal:t=>{$('#q').value=t;show()},onEnd:mend});if(!vc)mend()};
$('.sg').onclick=e=>{const a=e.target.closest('[data-s]');if(a){$('#q').value=a.dataset.s;show()}};
{const n=cart().reduce((a,i)=>a+i.q,0);if(n)$('#cr').innerHTML='<a class="crb" href="cart.html">🛒 Aap ke cart mein <b>'+n+'</b> item hain. Order mukammal karein →</a>'}
const mini=p=>'<a class="mini" href="product.html?id='+p.id+'"><img src="'+esc(p.images[0])+'" loading="lazy" alt=""><div class="t">'+esc(p.title)+'</div><b>'+rs(p.price)+'</b></a>';
function rows(){const on=!cat&&!$('#q').value;const f=all.filter(p=>p.badge&&!p.soldout).sort((a,b)=>(b.badge=='Best Seller')-(a.badge=='Best Seller')).slice(0,8);
$('#fr').innerHTML=on&&f.length?'<h3 class="rt">⭐ Khaas Products</h3><div class="hrow">'+f.map(mini).join('')+'</div>':'';
const r=JSON.parse(localStorage.rvw||'[]').map(id=>all.find(p=>p.id==id)).filter(Boolean).slice(0,8);
$('#rc').innerHTML=on&&r.length?'<h3 class="rt">👀 Aap ne dekha</h3><div class="hrow">'+r.map(mini).join('')+'</div>':''}
function show(){rows();const Q=parseQ($('#q').value),w=wish(),pb=$('#pb').value.split('-').map(Number),so=Q.sort||$('#so').value;
document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',(b.dataset.c=='All'?'':b.dataset.c)==cat));
let l=qf(all.filter(p=>(cat=='❤'?w.includes(p.id):(!cat||p.category==cat))&&(!pb[1]||(p.price>=pb[0]&&p.price<=pb[1]))),Q.g);
if(so=='l')l=[...l].sort((a,b)=>a.price-b.price);if(so=='h')l=[...l].sort((a,b)=>b.price-a.price);
$('#ct').innerHTML=(cat=='❤'?'❤️ Pasandeeda':cat?em(cat)+' '+esc(cat):'🔥 Sab Products')+' <small>('+l.length+')</small>';
$('#g').innerHTML=l.map(p=>{const on=w.includes(p.id);return '<a class="card'+(p.soldout?' sd':'')+'" href="product.html?id='+p.id+'"><div class="im"><img src="'+esc(p.images[0])+'" loading="lazy" alt="">'+(bd(p)?'<span class="bdg">'+esc(bd(p))+'</span>':'')+(p.soldout?'<span class="tag x">Sold Out</span>':CFG.SHIP==0?'<span class="tag">Free Delivery</span>':'')+'<button class="hrt'+(on?' on':'')+'" data-id="'+p.id+'">'+(on?'❤️':'🤍')+'</button></div><div class="in"><div class="t">'+esc(p.title)+'</div><b>'+rs(p.price)+'</b></div></a>'}).join('')||'<p class="empty">Koi product nahi mila. Dusre alfaaz try karein (jaise: ring, wallet, jootay, ghari).</p>'}
</script></body></html>
