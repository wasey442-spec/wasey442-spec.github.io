<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f85606"><link rel="stylesheet" href="style.css"><title>Store</title></head><body><div class="wrap">
<div class="hero"><h2>Naya Collection 🔥</h2><p>Pasandeeda cheezein, ghar baithe mangwayein</p></div>
<div class="trust" id="tr"></div>
<input id="q" placeholder="🔍 Search karein...">
<div class="chips" id="chips"></div>
<h3 id="ct"></h3>
<div class="grid" id="g"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script><script src="config.js"></script><script src="app.js"></script>
<script>
head();let all=[],cat='';
const EM={jewellery:'💍',shoes:'👟',accessories:'👜','winter wear':'🧥',watches:'⌚',kitchen:'🍳',beauty:'💄',electronics:'🎧',home:'🏠'};
const em=c=>EM[String(c).toLowerCase()]||'🛍️';
$('#tr').innerHTML='<span>'+(CFG.SHIP==0?'🚚 Free Delivery':'🚚 '+rs(CFG.FREE)+' se upar free delivery')+'</span><span>💵 Cash on Delivery</span><span>✅ Asaan Order</span>';
$('#g').innerHTML='<p class="empty">Loading...</p>';
(async()=>{const{data}=await sb.from('products').select('*').eq('active',true).order('id',{ascending:false});all=data||[];
const cs=[...new Set(all.map(p=>p.category).filter(Boolean))];
$('#chips').innerHTML=['All',...cs].map(c=>'<button data-c="'+esc(c)+'">'+(c=='All'?'🔥 All':em(c)+' '+esc(c))+'</button>').join('');show()})();
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c=='All'?'':b.dataset.c;show()};
$('#q').oninput=show;
function show(){const q=$('#q').value.toLowerCase();
document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',(b.dataset.c=='All'?'':b.dataset.c)==cat));
const l=all.filter(p=>(!cat||p.category==cat)&&(p.title+' '+(p.category||'')+' '+(p.descr||'')).toLowerCase().includes(q));
$('#ct').innerHTML=(cat?em(cat)+' '+esc(cat):'🔥 Sab Products')+' <small>('+l.length+')</small>';
$('#g').innerHTML=l.map(p=>'<a class="card" href="product.html?id='+p.id+'"><div class="im"><img src="'+esc(p.images[0])+'" loading="lazy" alt="">'+(CFG.SHIP==0?'<span class="tag">Free Delivery</span>':'')+'</div><div class="in"><div class="t">'+esc(p.title)+'</div><b>'+rs(p.price)+'</b></div></a>').join('')||'<p class="empty">Koi product nahi mila</p>'}
</script></body></html>
