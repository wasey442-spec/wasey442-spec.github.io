<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f85606"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>Store</title></head><body><div class="wrap">
<div class="hero"><h2>Naya Collection 🔥</h2><p>Pasandeeda cheezein, ghar baithe mangwayein</p></div>
<div class="trust" id="tr"></div>
<input id="q" placeholder="🔍 Search karein...">
<div class="chips" id="chips"></div>
<div class="sortbar"><select id="so"><option value="n">Naya pehle</option><option value="l">Sasta pehle</option><option value="h">Mehnga pehle</option></select><select id="pb"><option value="">Har price</option><option value="0-1000">Rs 1,000 tak</option><option value="1000-2000">1,000 - 2,000</option><option value="2000-3000">2,000 - 3,000</option><option value="3000-999999">3,000 se upar</option></select></div>
<div id="fr"></div><div id="rc"></div>
<h3 id="ct"></h3>
<div class="grid" id="g"></div>
<div class="how"><h3>🛍️ Order kaise karein?</h3><div class="steps"><div><b>1</b><span>Product chunein</span></div><div><b>2</b><span>Naam aur address likhein</span></div><div><b>3</b><span>Ghar par paise dein (COD)</span></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script><script src="config.js"></script><script src="app.js"></script>
<script>
window.onS=S=>{if(+S.bundle_n&&+S.bundle_off)$('#tr').insertAdjacentHTML('beforeend','<span>🎁 '+S.bundle_n+' lo, Rs '+S.bundle_off+' bachao</span>');if(S.hero_t)$('.hero h2').textContent=S.hero_t;if(S.hero_p)$('.hero p').textContent=S.hero_p};
head();let all=[],cat='';
const EM={jewellery:'💍',shoes:'👟',accessories:'👜','winter wear':'🧥',watches:'⌚',kitchen:'🍳',beauty:'💄',electronics:'🎧',home:'🏠'};
const bd=p=>p.badge||(p.created_at&&Date.now()-new Date(p.created_at)<5*864e5?'Naya':'');
const em=c=>EM[String(c).toLowerCase()]||'🛍️';
$('#tr').innerHTML='<span>'+(CFG.SHIP==0?'🚚 Free Delivery':'🚚 '+rs(CFG.FREE)+' se upar free delivery')+'</span><span>💵 Cash on Delivery</span><span>✅ Asaan Order</span>';
$('#g').innerHTML='<div class="card sk"><div class="im"></div><div class="in"><div class="t"></div></div></div>'.repeat(4);
(async()=>{const{data}=await sb.from('products').select('*').eq('active',true).order('id',{ascending:false});all=data||[];
const cs=[...new Set(all.map(p=>p.category).filter(Boolean))];
$('#chips').innerHTML=['All',...cs,'❤'].map(c=>'<button data-c="'+esc(c)+'">'+(c=='All'?'🔥 All':c=='❤'?'❤️ Pasandeeda':em(c)+' '+esc(c))+'</button>').join('');show()})();
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c=='All'?'':b.dataset.c;show()};
$('#q').oninput=show;$('#so').onchange=show;$('#pb').onchange=show;
$('#g').onclick=e=>{const h=e.target.closest('.hrt');if(!h)return;e.preventDefault();const on=tw(+h.dataset.id);h.classList.toggle('on',on);h.textContent=on?'❤️':'🤍';if(cat=='❤')show()};
const mini=p=>'<a class="mini" href="product.html?id='+p.id+'"><img src="'+esc(p.images[0])+'" loading="lazy" alt=""><div class="t">'+esc(p.title)+'</div><b>'+rs(p.price)+'</b></a>';
function rows(){const on=!cat&&!$('#q').value;const f=all.filter(p=>bd(p)&&!p.soldout).sort((a,b)=>(b.badge=='Best Seller')-(a.badge=='Best Seller')).slice(0,8);
$('#fr').innerHTML=on&&f.length?'<h3 class="rt">⭐ Khaas Products</h3><div class="hrow">'+f.map(mini).join('')+'</div>':'';
const r=JSON.parse(localStorage.rvw||'[]').map(id=>all.find(p=>p.id==id)).filter(Boolean).slice(0,8);
$('#rc').innerHTML=on&&r.length?'<h3 class="rt">👀 Aap ne dekha</h3><div class="hrow">'+r.map(mini).join('')+'</div>':''}
function show(){rows();const q=$('#q').value.toLowerCase(),w=wish(),pb=$('#pb').value.split('-').map(Number),so=$('#so').value;
document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',(b.dataset.c=='All'?'':b.dataset.c)==cat));
let l=all.filter(p=>(cat=='❤'?w.includes(p.id):(!cat||p.category==cat))&&(p.title+' '+(p.category||'')+' '+(p.descr||'')).toLowerCase().includes(q)&&(!pb[1]||(p.price>=pb[0]&&p.price<=pb[1])));
if(so=='l')l=[...l].sort((a,b)=>a.price-b.price);if(so=='h')l=[...l].sort((a,b)=>b.price-a.price);
$('#ct').innerHTML=(cat=='❤'?'❤️ Pasandeeda':cat?em(cat)+' '+esc(cat):'🔥 Sab Products')+' <small>('+l.length+')</small>';
$('#g').innerHTML=l.map(p=>{const on=w.includes(p.id);return '<a class="card'+(p.soldout?' sd':'')+'" href="product.html?id='+p.id+'"><div class="im"><img src="'+esc(p.images[0])+'" loading="lazy" alt="">'+(bd(p)?'<span class="bdg">'+esc(bd(p))+'</span>':'')+(p.soldout?'<span class="tag x">Sold Out</span>':CFG.SHIP==0?'<span class="tag">Free Delivery</span>':'')+'<button class="hrt'+(on?' on':'')+'" data-id="'+p.id+'">'+(on?'❤️':'🤍')+'</button></div><div class="in"><div class="t">'+esc(p.title)+'</div><b>'+rs(p.price)+'</b></div></a>'}).join('')||'<p class="empty">Koi product nahi mila</p>'}
</script></body></html>
