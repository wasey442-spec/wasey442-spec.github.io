<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="admin.json"><link rel="apple-touch-icon" href="admin-192.png"><meta name="theme-color" content="#1f2430"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme.css?v=8"><title>Admin</title></head><body><div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script><script src="config.js"></script><script src="app.js"></script>
<script>
const STS=['New','Confirmed','Shipped','Delivered','Cancelled'];let O=[],PL=[];
const TB='<div class="tabs"><button data-k="add" onclick="add()">➕ Post</button><button data-k="list" onclick="list()">📦 Products</button><button data-k="ord" onclick="ord()">🧾 Orders</button><button data-k="hs" onclick="hs()">📊 Hisaab</button><button data-k="cu" onclick="cu()">👥 Customers</button><button data-k="rv" onclick="rv()">⭐ Reviews</button><button data-k="set" onclick="set()">⚙️ Settings</button><button onclick="sb.auth.signOut().then(login)">Logout</button></div><div id="t"></div>';
(async()=>{const{data:{session}}=await sb.auth.getSession();session?lock():login()})();
function login(){$('#app').innerHTML='<h2>Admin Login</h2><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password"><button class="btn" onclick="dl()">Login</button>'}
async function dl(){const{error}=await sb.auth.signInWithPassword({email:$('#e').value,password:$('#p').value});error?alert(error.message):panel()}
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return s}}
function lock(){if(!localStorage.apin)return panel();$('#app').innerHTML='<div class="box"><h3>🔒 Admin PIN</h3><input id="pn" type="password" inputmode="numeric" maxlength="8" placeholder="PIN likhein"><button class="btn" onclick="unl()">Kholein</button></div>'}
async function unl(){(await sha($('#pn').value))==localStorage.apin?panel():alert('PIN ghalat hai')}
function panel(){$('#app').innerHTML=TB;add()}
let POLL=null,LAST=0;const NEXT={New:'Confirmed',Confirmed:'Shipped',Shipped:'Delivered'};
function toast(t){document.body.insertAdjacentHTML('beforeend','<div class="toast">'+esc(t)+'</div>');setTimeout(()=>{const e=document.querySelector('.toast');if(e)e.remove()},4500)}
function mk(k){if(k!='ord'&&POLL){clearInterval(POLL);POLL=null}document.querySelectorAll('.tabs button[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k==k));const b=document.querySelector('.tabs button.on');if(b&&b.scrollIntoView)b.scrollIntoView({inline:'center',block:'nearest'})}
const BD=v=>'<select id="bd"><option value="">Badge nahi</option>'+['Best Seller','Naya','Hot'].map(x=>'<option'+(v==x?' selected':'')+'>'+x+'</option>').join('')+'</select>';
function add(){mk('add');$('#t').innerHTML='<div class="box"><h3>Naya Product Post Karein</h3><input id="f" type="file" accept="image/*" multiple><input id="ti" placeholder="Product ka naam"><input id="co" type="number" placeholder="Cost price (Markaz ka Product Total)" oninput="if(!pr.dataset.u)pr.value=Math.round(this.value*1.45/10)*10;pfx()"><input id="pr" type="number" placeholder="Selling price" oninput="this.dataset.u=1;pfx()"><div id="pf" class="sm"></div><input id="ca" placeholder="Category (Shoes, Jewellery...)"><input id="sz" placeholder="Sizes (S,M,L,XL) - optional"><input id="cl" placeholder="Colours (Black,Red) - optional">'+BD('')+'<textarea id="de" placeholder="Description"></textarea>'+DT()+'<button class="btn" id="sv" onclick="addP()">Post Karein</button></div>'}
function autoDesc(){const v=i=>$(i).value.trim(),t=v('#ti');if(!t)return alert('Pehle product ka naam likhein');let d=t+'.';if(v('#cl'))d+='\nColours: '+v('#cl')+'.';if(v('#sz'))d+='\nSizes: '+v('#sz')+'. Order se pehle size zaroor confirm karein.';d+='\nCash on Delivery, poore Pakistan mein.';$('#de').value=d}
const DT=()=>'<div class="row2"><select id="dl" style="flex:.6;margin:5px 0"><option value="ur-PK">اردو</option><option value="en-IN">English</option></select><button type="button" class="btn" id="dm" onclick="descMic()">🎤 Bol kar likhein</button></div><button type="button" class="btn" style="background:#475569" onclick="autoDesc()">✨ Description khud likhein</button><details><summary>📋 Markaz ki details paste karein</summary><textarea id="mz" placeholder="Markaz ke Product Details wala text yahan paste karein..."></textarea><button type="button" class="btn" style="background:#0f766e" onclick="mzClean()">🧹 Saaf karke description banayein</button></details>';
let DV=null;
function descMic(){if(DV){DV.stop();return}const base=$('#de').value.trim(),w=t=>$('#de').value=(base?base+' ':'')+t;$('#dm').textContent='🔴 Sun raha hoon (rukne ke liye tap)';
DV=voice({lang:$('#dl').value,onInterim:w,onFinal:w,onEnd:()=>{DV=null;const b=$('#dm');if(b)b.textContent='🎤 Bol kar likhein'}});if(!DV)$('#dm').textContent='🎤 Bol kar likhein'}
function mzClean(){let t=$('#mz').value;if(!t.trim())return alert('Pehle Markaz ki details paste karein');
const NZ=/\b(cross[- ]?border|explosions?|explosive|wholesale|drop ?shipping|factory direct|hot[- ]?sell(ing)?|free shipping)\b/ig,JK=/^(product details|delivery|return|save extra|copy link|download|place order|share|add to bag|buy now|\d+k?\+? in stock|in stock|rs\.? ?\d)/i;
t=t.replace(/：/g,':').replace(/[\u3000-\u9fff\uf900-\ufaff\uff00-\uffef]+/g,' ').replace(NZ,' ');
const L=[...new Set(t.split(/\r?\n/).map(s=>s.replace(/\s+/g,' ').replace(/\s*:\s*/g,': ').trim()).filter(s=>s.length>1&&/[A-Za-z0-9\u0600-\u06FF]/.test(s)&&!JK.test(s)))];
$('#de').value=L.map(s=>/^[^:]{1,30}:\s*\S/.test(s)?'• '+s:s).join('\n').slice(0,700);alert('Saaf details description mein aa gayi ✅\nZaroorat ho to badal lein.')}
function pfx(){const e=$('#pf');if(!e)return;const c=+$('#co').value||0,p=+$('#pr').value||0;if(!p){e.innerHTML='';return}const d=p-c;e.innerHTML='💰 Profit: <b style="color:'+(d>0?'#166534':'#b91c1c')+'">Rs '+d+'</b>'+(c?' ('+Math.round(d/c*100)+'% cost par)':'')}
async function bulk(){const pc=parseFloat($('#bp').value),cat=$('#bc').value;if(!pc||Math.abs(pc)>50)return alert('% ka number likhein (jaise 5 ya -10, 50 se kam)');
const L=PL.filter(p=>!cat||p.category==cat);if(!L.length)return alert('Koi product nahi mila');if(!confirm(L.length+' products ki price '+(pc>0?'+':'')+pc+'% badlegi. Aage barhein?'))return;
for(const p of L){const np=Math.max(1,Math.round(p.price*(1+pc/100)/10)*10);await sb.from('products').update({price:np}).eq('id',p.id)}alert('Price badal gayi ✅');list()}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,900/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.8)};i.src=URL.createObjectURL(f)})}
async function ins(o){let r=await sb.from('products').insert(o);if(r.error&&'badge' in o){const{badge,...x}=o;r=await sb.from('products').insert(x)}return r}
async function addP(){const fs=[...$('#f').files];if(!fs.length||!$('#ti').value||!$('#pr').value)return alert('Photo, naam aur price zaroori hain');
$('#sv').disabled=true;$('#sv').textContent='Upload ho raha hai...';const imgs=[];
for(const[i,f]of fs.entries()){const n=Date.now()+'-'+i+'.jpg';const{error}=await sb.storage.from('pics').upload(n,await shrink(f),{contentType:'image/jpeg'});if(error){$('#sv').disabled=false;return alert(error.message)}imgs.push(sb.storage.from('pics').getPublicUrl(n).data.publicUrl)}
const v=i=>$(i).value.trim();
const{error}=await ins({title:v('#ti'),price:+v('#pr'),cost:+v('#co')||0,category:v('#ca'),sizes:v('#sz'),colors:v('#cl'),descr:v('#de'),badge:v('#bd')||null,images:imgs});
error?alert(error.message):(alert('Post ho gaya ✅'),add())}
async function list(){mk('list');const{data}=await sb.from('products').select('*').order('id',{ascending:false});PL=data||[];
const CT=[...new Set(PL.map(p=>p.category).filter(Boolean))];
$('#t').innerHTML='<div class="box"><b>💲 Sab ki price ek saath badlein</b><select id="bc"><option value="">Sab products</option>'+CT.map(c=>'<option>'+esc(c)+'</option>').join('')+'</select><input id="bp" type="number" placeholder="% likhein (jaise 5 ya -10)"><button class="btn" onclick="bulk()">Lagayein</button></div>'+PL.map((p,x)=>'<div class="box row"><img src="'+esc(p.images[0])+'"><div style="flex:1">'+esc(p.title)+'<br>'+rs(p.price)+' (profit '+rs(p.price-p.cost)+')'+(p.badge?' <b>• '+esc(p.badge)+'</b>':'')+(p.soldout?' <b>• SOLD OUT</b>':'')+(p.active?'':' <b>• HIDDEN</b>')+'</div><div style="display:flex;flex-direction:column;gap:4px"><button onclick="ed('+x+')">✏️ Edit</button><button onclick="dup('+x+')">📄 Copy</button><button onclick="so('+p.id+','+!p.soldout+')">'+(p.soldout?'✅ Available':'📛 Sold Out')+'</button><button onclick="tg('+p.id+','+!p.active+')">'+(p.active?'Hide':'Show')+'</button><button onclick="rm('+p.id+')">🗑</button></div></div>').join('')||'<p>Abhi koi product nahi</p>'}
function ed(x){const p=PL[x],f=(i,l,v,t)=>'<label><small>'+l+'</small></label><input id="'+i+'" '+(t||'')+' value="'+esc(v)+'">';
$('#t').innerHTML='<div class="box"><h3>✏️ Product Edit</h3>'+f('ti','Naam',p.title)+f('co','Cost price',p.cost,'type="number" oninput="pfx()"')+f('pr','Selling price',p.price,'type="number" oninput="pfx()"')+'<div id="pf" class="sm"></div>'+f('ca','Category',p.category)+f('sz','Sizes',p.sizes)+f('cl','Colours',p.colors)+'<label><small>Badge</small></label>'+BD(p.badge)+'<label><small>Description</small></label><textarea id="de">'+esc(p.descr)+'</textarea>'+DT()+'<button class="btn" onclick="upd('+p.id+')">💾 Save</button><button class="btn" style="background:#777" onclick="list()">Cancel</button></div>';pfx()}
async function upd(id){const v=i=>$(i).value.trim(),o={title:v('#ti'),price:+v('#pr'),cost:+v('#co')||0,category:v('#ca'),sizes:v('#sz'),colors:v('#cl'),descr:v('#de'),badge:v('#bd')||null};
let r=await sb.from('products').update(o).eq('id',id);if(r.error){const{badge,...x}=o;r=await sb.from('products').update(x).eq('id',id)}r.error?alert(r.error.message):(alert('Save ho gaya ✅'),list())}
async function dup(x){const p=PL[x];const{error}=await ins({title:p.title+' (copy)',price:p.price,cost:p.cost,category:p.category,sizes:p.sizes,colors:p.colors,descr:p.descr,images:p.images,active:false});error?alert(error.message):(alert('Copy ban gayi (Hidden hai). Ab ✏️ Edit se badal kar Show karein.'),list())}
async function so(id,a){const{error}=await sb.from('products').update({soldout:a}).eq('id',id);error?alert('Pehle update.sql Supabase mein chalayein. '+error.message):list()}
async function tg(id,a){await sb.from('products').update({active:a}).eq('id',id);list()}
async function rm(id){if(!confirm('Product delete karein? Uski photos bhi hat jayengi.'))return;const p=PL.find(x=>x.id==id);await sb.from('products').delete().eq('id',id);if(p&&p.images)await sb.storage.from('pics').remove(p.images.map(u=>decodeURIComponent(u.split('/').pop().split('?')[0])));list()}
const pf=o=>o.total-o.items.reduce((a,i)=>a+i.cost*i.q,0);
async function ord(){mk('ord');const{data}=await sb.from('orders').select('*').order('id',{ascending:false});O=data||[];LAST=Math.max(0,...O.map(o=>o.id));if(POLL)clearInterval(POLL);POLL=setInterval(poll,30000);
$('#t').innerHTML='<div class="box" id="ds"></div><input id="os" placeholder="🔍 Naam, phone ya product" oninput="rd()"><select id="of" onchange="rd()"><option value="">Sab status</option><option value="pend">🔴 Markaz mein order baqi</option>'+STS.map(s=>'<option>'+s+'</option>').join('')+'</select><div class="row2"><button class="btn" style="background:#475569" onclick="csv()">📥 CSV download</button></div><div class="row2"><button class="btn" style="background:#b91c1c" onclick="clean(0)">🧹 Cancelled saaf</button><button class="btn" style="background:#b91c1c" onclick="clean(30)">🧹 Purane Delivered saaf</button></div><div id="ol"></div>';rd()}
async function poll(){if(document.hidden||!$('#ol'))return;const{data}=await sb.from('orders').select('*').order('id',{ascending:false});if(!data)return;const mx=Math.max(0,...data.map(o=>o.id));if(mx>LAST||data.length!=O.length){if(mx>LAST){toast('🆕 Naya order aaya! #'+mx);if(navigator.vibrate)navigator.vibrate([120,60,120])}LAST=mx;O=data;rd()}}
const PD=o=>!o.marked&&['New','Confirmed'].includes(o.status);
function flags(o){const s=O.filter(x=>x.phone==o.phone&&x.id!=o.id),c=s.filter(x=>x.status=='Cancelled').length,d=s.filter(x=>x.status=='Delivered').length;return(d?'<div class="flag g">🔁 Repeat customer ('+d+' delivered)</div>':'')+(c?'<div class="flag r">⚠️ Is number ke '+c+' order pehle cancel hue</div>':'')}
function rd(){const sm=f=>O.filter(f).reduce((a,o)=>a+pf(o),0);
$('#ds').innerHTML='🆕 Naye: <b>'+O.filter(o=>o.status=='New').length+'</b> | 🚚 Shipped: <b>'+O.filter(o=>o.status=='Shipped').length+'</b> | 🔴 Markaz baqi: <b>'+O.filter(PD).length+'</b><br>✅ Delivered profit: <b>'+rs(sm(o=>o.status=='Delivered'))+'</b><br>⏳ Pending profit: <b>'+rs(sm(o=>['New','Confirmed','Shipped'].includes(o.status)))+'</b>';
const q=$('#os').value.toLowerCase(),sf=$('#of').value;
$('#ol').innerHTML=O.map((o,x)=>[o,x]).filter(([o])=>(!sf||(sf=='pend'?PD(o):o.status==sf))&&(o.name+' '+o.phone+' '+o.items.map(i=>i.title).join(' ')).toLowerCase().includes(q)).map(([o,x])=>'<div class="box"><b>#'+o.id+' '+esc(o.name)+'</b> '+esc(o.phone)+'<br>'+esc(o.address)+', '+esc(o.city)+'<br>'+o.items.map(i=>esc(i.title)+' ('+esc(i.size)+' '+esc(i.color)+') ×'+i.q).join('<br>')+'<br><b>COD '+rs(o.total)+'</b> | Profit ~'+rs(pf(o))+(o.discount?'<br><small>🎁 Bundle discount '+rs(o.discount)+'</small>':'')+flags(o)+'<label class="mk"><input type="checkbox" '+(o.marked?'checked':'')+' onchange="mkd('+x+',this.checked)"> ✅ Markaz mein order de diya</label><input placeholder="📝 Note (jaise: colour badla)" value="'+esc(o.note)+'" onchange="nt('+x+',this.value)"><select onchange="st('+o.id+',this.value,'+x+')">'+STS.map(s=>'<option'+(s==o.status?' selected':'')+'>'+s+'</option>').join('')+'</select>'+(NEXT[o.status]?'<button class="btn" style="background:linear-gradient(135deg,#0f766e,#14b8a6)" onclick="nx('+x+')">▶️ Agla step: '+NEXT[o.status]+' (status + customer message)</button>':'')+'<button class="btn g" onclick="wa('+x+')">📲 Supplier ko bhejein</button><button class="btn" style="background:#475569" onclick="cp('+x+')">📋 Copy details</button><button class="btn" onclick="cm('+x+')">💬 Customer ko message</button><button class="btn" style="background:#b91c1c" onclick="dor('+x+')">🗑 Order delete</button></div>').join('')||'<p>Koi order nahi mila</p>'}
async function mkd(x,v){const{error}=await sb.from('orders').update({marked:v}).eq('id',O[x].id);if(error){alert('Pehle update2.sql Supabase mein chalayein. '+error.message);return ord()}O[x].marked=v;rd()}
async function nt(x,v){const{error}=await sb.from('orders').update({note:v}).eq('id',O[x].id);error?alert('Pehle update2.sql Supabase mein chalayein.'):O[x].note=v}
async function st(id,s,x){await sb.from('orders').update({status:s}).eq('id',id);O[x].status=s;alert('Status: '+s+'. Ab "Customer ko message" dabayein');rd()}
function csv(){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const rows=[['ID','Date','Naam','Phone','Shehar','Address','Items','Total','Profit','Status'],...O.map(o=>[o.id,(o.created_at||'').slice(0,10),o.name,o.phone,o.city,o.address,o.items.map(i=>i.title+' ('+i.size+' '+i.color+') x'+i.q).join('; '),o.total,pf(o),o.status])];
const b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='orders-'+new Date().toISOString().slice(0,10)+'.csv';a.click()}
async function dor(x){const o=O[x];if(!confirm('Order #'+o.id+' ('+o.name+') hamesha ke liye delete karein?\nProfit ka hisaab bhi is order ke baghair ghat jayega. Pehle CSV download kar lein.'))return;const{error}=await sb.from('orders').delete().eq('id',o.id);if(error)return alert(error.message);ord()}
async function clean(days){const cut=Date.now()-days*864e5,L=O.filter(o=>days?o.status=='Delivered'&&new Date(o.created_at)<cut:o.status=='Cancelled');
if(!L.length)return alert('Saaf karne ke liye kuch nahi hai');if(!confirm(L.length+' order hamesha ke liye delete honge ('+(days?'Delivered, '+days+' din se purane':'Cancelled')+').\nPehle 📥 CSV download kar lein. Aage barhein?'))return;
const{error}=await sb.from('orders').delete().in('id',L.map(o=>o.id));error?alert(error.message):(alert(L.length+' order saaf ho gaye ✅'),ord())}
function ph92(p){p=p.replace(/\D/g,'');return p[0]=='0'?'92'+p.slice(1):p}
function cm(x){const o=O[x],it=o.items.map(i=>i.title+' ('+i.size+' '+i.color+') x'+i.q).join(', '),n=o.name,id=o.id,T=o.total,d=CFG.DELIVERY||'jald';
const M={New:'Assalam o Alaikum '+n+'! Aap ka order #'+id+' mil gaya hai: '+it+'. Total COD Rs '+T+'. Hum jald confirm karenge. Shukriya - '+CFG.STORE,
Confirmed:'Assalam o Alaikum '+n+'! Aap ka order #'+id+' confirm ho gaya hai: '+it+'. Total COD Rs '+T+'. Jald dispatch hoga. Shukriya - '+CFG.STORE,
Shipped:'Assalam o Alaikum '+n+'! Aap ka order #'+id+' dispatch ho gaya hai. Delivery '+d+' mein hogi. Rider ko Rs '+T+' tayyar rakhein. - '+CFG.STORE,
Delivered:'Shukriya '+n+'! Aap ka order #'+id+' deliver ho gaya hai. Product pasand aaye to dosto ko zaroor batayein. - '+CFG.STORE,
Cancelled:'Assalam o Alaikum '+n+', aap ka order #'+id+' cancel kar diya gaya hai. Dobara order ke liye hum hazir hain. - '+CFG.STORE};
open('https://wa.me/'+ph92(o.phone)+'?text='+encodeURIComponent(M[o.status]||M.New))}
const det=o=>o.name+'\n'+o.phone+'\n'+o.address+', '+o.city+'\n'+o.items.map(i=>i.title+' | '+i.size+' | '+i.color+' x'+i.q).join('\n')+'\nCOD: '+o.total;
function cp(x){navigator.clipboard.writeText(det(O[x])).then(()=>alert('Copy ho gaya ✅'))}
async function nx(x){const o=O[x],n=NEXT[o.status];if(!n)return;if(n=='Confirmed'){try{navigator.clipboard.writeText(det(o)).catch(()=>{});toast('📋 Details copy ho gaye. Ab Markaz mein order dein')}catch(e){}}
const{error}=await sb.from('orders').update({status:n}).eq('id',o.id);if(error)return alert(error.message);o.status=n;rd();cm(x)}
function wa(x){const o=O[x];const t='Order #'+o.id+'\nNaam: '+o.name+'\nPhone: '+o.phone+'\nAddress: '+o.address+', '+o.city+'\n'+o.items.map(i=>i.title+' | '+i.size+' | '+i.color+' | Qty '+i.q).join('\n')+'\nCOD Amount: '+o.total;open('https://wa.me/'+CFG.SUPPLIER+'?text='+encodeURIComponent(t))}
async function hs(){mk('hs');const{data}=await sb.from('orders').select('*').order('id',{ascending:false});O=data||[];
const live=O.filter(o=>o.status!='Cancelled'),dy=d=>new Date(d).toDateString();
const rows=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const L=live.filter(o=>dy(o.created_at)==d.toDateString());return{l:d.toLocaleDateString('en-GB',{weekday:'short'}),n:L.length,t:L.reduce((a,o)=>a+o.total,0),p:L.reduce((a,o)=>a+pf(o),0)}});
const mx=Math.max(1,...rows.map(r=>r.t)),td=rows[6],wk=rows.reduce((a,r)=>({n:a.n+r.n,t:a.t+r.t,p:a.p+r.p}),{n:0,t:0,p:0});
const tp={};live.forEach(o=>o.items.forEach(i=>tp[i.title]=(tp[i.title]||0)+i.q));const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,3);
$('#t').innerHTML='<div class="box"><h3>📅 Aaj</h3>Orders: <b>'+td.n+'</b> | Sales: <b>'+rs(td.t)+'</b> | Profit: <b>'+rs(td.p)+'</b></div><div class="box"><h3>📈 Pichle 7 din</h3>Orders: <b>'+wk.n+'</b> | Sales: <b>'+rs(wk.t)+'</b> | Profit: <b>'+rs(wk.p)+'</b><div class="chart">'+rows.map(r=>'<div><i style="height:'+Math.round(r.t/mx*100)+'px"></i><small>'+r.l+'</small><small>'+r.n+'</small></div>').join('')+'</div></div><div class="box"><h3>🏆 Sab se zyada bikne wale</h3>'+(top.map(x=>esc(x[0])+' — <b>'+x[1]+'</b>').join('<br>')||'Abhi koi order nahi')+'</div>'}
async function cu(){mk('cu');const{data}=await sb.from('orders').select('*').order('id',{ascending:false});O=data||[];const M={};
O.forEach(o=>{const m=M[o.phone]||(M[o.phone]={n:o.name,ph:o.phone,c:o.city,o:0,d:0,x:0,s:0,l:o.created_at});m.o++;if(o.status=='Delivered')m.d++;if(o.status=='Cancelled')m.x++;else m.s+=o.total});
const L=Object.values(M).sort((a,b)=>b.s-a.s);
$('#t').innerHTML='<div class="box"><b>👥 '+L.length+' customers</b> · 🔁 Repeat: <b>'+L.filter(m=>m.d>1).length+'</b></div>'+(L.map(m=>'<div class="box"><b>'+esc(m.n)+'</b> '+esc(m.ph)+'<br><small>'+esc(m.c)+' · Aakhri order: '+String(m.l||'').slice(0,10)+'</small><br>Orders: <b>'+m.o+'</b> | Delivered: <b>'+m.d+'</b> | Cancel: <b>'+m.x+'</b><br>Total khareedari: <b>'+rs(m.s)+'</b>'+(m.d>1?' <span class="flag g">🔁 Repeat</span>':'')+(m.x>1?' <span class="flag r">⚠️ Cancel zyada</span>':'')+'<a class="btn g" target="_blank" href="https://wa.me/'+ph92(m.ph)+'">💬 WhatsApp</a></div>').join('')||'<p>Abhi koi customer nahi</p>')}
async function rv(){mk('rv');const[a,b]=await Promise.all([sb.from('reviews').select('*').order('id',{ascending:false}),sb.from('products').select('id,title')]);
if(a.error)return $('#t').innerHTML='<div class="box">Pehle update2.sql Supabase mein chalayein.</div>';
const T={};(b.data||[]).forEach(p=>T[p.id]=p.title);
$('#t').innerHTML=(a.data||[]).map(r=>'<div class="box"><b>'+'⭐'.repeat(r.stars)+'</b> '+esc(r.name)+' <small>('+esc(T[r.product_id]||'?')+')</small><br>'+esc(r.body)+'<br>'+(r.approved?'<small>✅ Dikh raha hai</small>':'<button class="btn g" onclick="rva('+r.id+')">✅ Approve</button>')+'<button class="btn" style="background:#b91c1c" onclick="rvd('+r.id+')">🗑 Delete</button></div>').join('')||'<p>Abhi koi review nahi</p>'}
async function rva(id){await sb.from('reviews').update({approved:true}).eq('id',id);rv()}
async function rvd(id){if(confirm('Review delete karein?')){await sb.from('reviews').delete().eq('id',id);rv()}}
async function set(){mk('set');const a=await sb.from('settings').select('*');const S={};(a.data||[]).forEach(r=>S[r.k]=r.v);
$('#t').innerHTML='<div class="box"><h3>⚙️ Store Settings</h3>'+(a.error?'<p>Pehle update.sql Supabase mein chalayein.</p>':'')+'<label><small>Upar ki announcement bar (khali = nahi dikhegi)</small></label><input id="an" value="'+esc(S.announce)+'" placeholder="Winter Sale 🔥 Free Delivery!"><label><small>Banner ka bara likha</small></label><input id="ht" value="'+esc(S.hero_t)+'" placeholder="Naya Collection 🔥"><label><small>Banner ka chhota likha</small></label><input id="hp" value="'+esc(S.hero_p)+'" placeholder="Pasandeeda cheezein, ghar baithe mangwayein"><label><small>🎁 Bundle: kitne items lene par (0 = band)</small></label><input id="bn" type="number" value="'+esc(S.bundle_n)+'" placeholder="2"><label><small>Bundle discount (Rs)</small></label><input id="bo" type="number" value="'+esc(S.bundle_off)+'" placeholder="200"><button class="btn" onclick="sv2()">💾 Save</button></div>'+
'<div class="box"><h3>🔒 Admin PIN</h3><small>Ye sirf is phone par casual lock hai. Asli hifazat aap ka email password hai.</small><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="Naya PIN (4 se 8 number)"><button class="btn" onclick="spin()">🔒 PIN set karein</button><button class="btn" style="background:#777" onclick="rpin()">PIN hata dein</button></div>'+
'<div class="box"><h3>📲 Admin ko app mein kholein</h3><small>Chrome ek hi jagah se do alag app install nahi karne deta. Store app ke icon ko long press karein aur <b>Admin Panel</b> chunein. Ya store ke neeche dukaan ka naam 5 dafa tap karein.</small><button class="btn" style="background:#475569" onclick="chk()">🔧 Install check</button></div>'}
async function sv2(){const v=i=>$(i).value.trim();const{error}=await sb.from('settings').upsert([{k:'announce',v:v('#an')},{k:'hero_t',v:v('#ht')},{k:'hero_p',v:v('#hp')},{k:'bundle_n',v:v('#bn')},{k:'bundle_off',v:v('#bo')}]);error?alert(error.message):alert('Save ho gaya ✅')}
async function spin(){const p=$('#pin').value;if(!/^\d{4,8}$/.test(p))return alert('PIN 4 se 8 number ka hona chahiye');localStorage.apin=await sha(p);alert('PIN set ho gaya ✅')}
function rpin(){localStorage.removeItem('apin');alert('PIN hat gaya')}
async function chk(){const ok=async u=>{try{return(await fetch(u,{cache:'no-store'})).ok}catch(e){return false}},r=[];
for(const u of ['admin.json','admin-192.png','admin-512.png','sw.js','manifest.json'])r.push(u+': '+(await ok(u)?'✅':'❌ upload nahi hui'));
const g=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();r.push('Service worker: '+(g?'✅':'❌'));
r.push('Mode: '+(matchMedia('(display-mode: standalone)').matches?'App ke andar':'Browser mein'));alert(r.join('\n'))}
</script></body></html>
