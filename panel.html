<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="admin.json"><link rel="apple-touch-icon" href="admin-192.png"><meta name="theme-color" content="#1f2430"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme.css?v=4"><title>Admin</title></head><body><div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script><script src="config.js"></script><script src="app.js"></script>
<script>
(async()=>{const{data:{session}}=await sb.auth.getSession();session?panel():login()})();
function login(){$('#app').innerHTML='<h2>Admin Login</h2><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password"><button class="btn" onclick="dl()">Login</button>'}
async function dl(){const{error}=await sb.auth.signInWithPassword({email:$('#e').value,password:$('#p').value});error?alert(error.message):panel()}
function panel(){$('#app').innerHTML='<div class="tabs"><button data-k="add" onclick="add()">➕ Post</button><button data-k="list" onclick="list()">📦 Products</button><button data-k="ord" onclick="ord()">🧾 Orders</button><button data-k="set" onclick="set()">⚙️ Settings</button><button onclick="sb.auth.signOut().then(login)">Logout</button></div><div id="t"></div>';add()}
function add(){mk('add');$('#t').innerHTML='<div class="box"><h3>Naya Product Post Karein</h3><input id="f" type="file" accept="image/*" multiple><input id="ti" placeholder="Product ka naam"><input id="co" type="number" placeholder="Cost price (Markaz ka Product Total)" oninput="if(!pr.dataset.u)pr.value=Math.round(this.value*1.45/10)*10"><input id="pr" type="number" placeholder="Selling price" oninput="this.dataset.u=1"><input id="ca" placeholder="Category (Shoes, Jewellery...)"><input id="sz" placeholder="Sizes (S,M,L,XL) - optional"><input id="cl" placeholder="Colours (Black,Red) - optional"><textarea id="de" placeholder="Description"></textarea><button class="btn" id="sv" onclick="addP()">Post Karein</button></div>'}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,900/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.8)};i.src=URL.createObjectURL(f)})}
async function addP(){const fs=[...$('#f').files];if(!fs.length||!$('#ti').value||!$('#pr').value)return alert('Photo, naam aur price zaroori hain');
$('#sv').disabled=true;$('#sv').textContent='Upload ho raha hai...';const imgs=[];
for(const[i,f]of fs.entries()){const n=Date.now()+'-'+i+'.jpg';const{error}=await sb.storage.from('pics').upload(n,await shrink(f),{contentType:'image/jpeg'});if(error){$('#sv').disabled=false;return alert(error.message)}imgs.push(sb.storage.from('pics').getPublicUrl(n).data.publicUrl)}
const v=i=>$(i).value.trim();
const{error}=await sb.from('products').insert({title:v('#ti'),price:+v('#pr'),cost:+v('#co')||0,category:v('#ca'),sizes:v('#sz'),colors:v('#cl'),descr:v('#de'),images:imgs});
error?alert(error.message):(alert('Post ho gaya ✅'),add())}
let PL=[];
async function list(){mk('list');const{data}=await sb.from('products').select('*').order('id',{ascending:false});PL=data||[];
$('#t').innerHTML=PL.map((p,x)=>'<div class="box row"><img src="'+esc(p.images[0])+'"><div style="flex:1">'+esc(p.title)+'<br>'+rs(p.price)+' (profit '+rs(p.price-p.cost)+')'+(p.soldout?' <b>• SOLD OUT</b>':'')+'</div><div style="display:flex;flex-direction:column;gap:4px"><button onclick="ed('+x+')">✏️ Edit</button><button onclick="so('+p.id+','+!p.soldout+')">'+(p.soldout?'✅ Available':'📛 Sold Out')+'</button><button onclick="tg('+p.id+','+!p.active+')">'+(p.active?'Hide':'Show')+'</button><button onclick="rm('+p.id+')">🗑</button></div></div>').join('')||'<p>Abhi koi product nahi</p>'}
function ed(x){const p=PL[x],f=(i,l,v,t)=>'<label><small>'+l+'</small></label><input id="'+i+'" '+(t||'')+' value="'+esc(v)+'">';
$('#t').innerHTML='<div class="box"><h3>✏️ Product Edit</h3>'+f('ti','Naam',p.title)+f('co','Cost price',p.cost,'type="number"')+f('pr','Selling price',p.price,'type="number"')+f('ca','Category',p.category)+f('sz','Sizes',p.sizes)+f('cl','Colours',p.colors)+'<label><small>Description</small></label><textarea id="de">'+esc(p.descr)+'</textarea><button class="btn" onclick="upd('+p.id+')">💾 Save</button><button class="btn" style="background:#777" onclick="list()">Cancel</button></div>'}
async function upd(id){const v=i=>$(i).value.trim();const{error}=await sb.from('products').update({title:v('#ti'),price:+v('#pr'),cost:+v('#co')||0,category:v('#ca'),sizes:v('#sz'),colors:v('#cl'),descr:v('#de')}).eq('id',id);error?alert(error.message):(alert('Save ho gaya ✅'),list())}
async function so(id,a){const{error}=await sb.from('products').update({soldout:a}).eq('id',id);error?alert('Pehle update.sql Supabase mein chalayein. '+error.message):list()}
async function tg(id,a){await sb.from('products').update({active:a}).eq('id',id);list()}
async function rm(id){if(!confirm('Product delete karein? Uski photos bhi hat jayengi.'))return;const p=PL.find(x=>x.id==id);await sb.from('products').delete().eq('id',id);if(p&&p.images)await sb.storage.from('pics').remove(p.images.map(u=>decodeURIComponent(u.split('/').pop().split('?')[0])));list()}
let O=[];const STS=['New','Confirmed','Shipped','Delivered','Cancelled'];
async function ord(){mk('ord');const{data}=await sb.from('orders').select('*').order('id',{ascending:false});O=data||[];
$('#t').innerHTML='<div class="box" id="ds"></div><input id="os" placeholder="🔍 Naam, phone ya product" oninput="rd()"><select id="of" onchange="rd()"><option value="">Sab status</option>'+STS.map(s=>'<option>'+s+'</option>').join('')+'</select><div class="row2"><button class="btn" style="background:#475569" onclick="csv()">📥 CSV download</button></div><div class="row2"><button class="btn" style="background:#b91c1c" onclick="clean(0)">🧹 Cancelled saaf</button><button class="btn" style="background:#b91c1c" onclick="clean(30)">🧹 Purane Delivered saaf</button></div><div id="ol"></div>';rd()}
function rd(){const pf=o=>o.total-o.items.reduce((a,i)=>a+i.cost*i.q,0),sm=f=>O.filter(f).reduce((a,o)=>a+pf(o),0);
$('#ds').innerHTML='🆕 Naye: <b>'+O.filter(o=>o.status=='New').length+'</b> | 🚚 Shipped: <b>'+O.filter(o=>o.status=='Shipped').length+'</b><br>✅ Delivered profit: <b>'+rs(sm(o=>o.status=='Delivered'))+'</b><br>⏳ Pending profit: <b>'+rs(sm(o=>['New','Confirmed','Shipped'].includes(o.status)))+'</b>';
const q=$('#os').value.toLowerCase(),sf=$('#of').value;
$('#ol').innerHTML=O.map((o,x)=>[o,x]).filter(([o])=>(!sf||o.status==sf)&&(o.name+' '+o.phone+' '+o.items.map(i=>i.title).join(' ')).toLowerCase().includes(q)).map(([o,x])=>'<div class="box"><b>#'+o.id+' '+esc(o.name)+'</b> '+esc(o.phone)+'<br>'+esc(o.address)+', '+esc(o.city)+'<br>'+o.items.map(i=>esc(i.title)+' ('+esc(i.size)+' '+esc(i.color)+') ×'+i.q).join('<br>')+'<br><b>COD '+rs(o.total)+'</b> | Profit ~'+rs(pf(o))+'<select onchange="st('+o.id+',this.value,'+x+')">'+STS.map(s=>'<option'+(s==o.status?' selected':'')+'>'+s+'</option>').join('')+'</select><button class="btn g" onclick="wa('+x+')">📲 Supplier ko bhejein</button><button class="btn" style="background:#475569" onclick="cp('+x+')">📋 Copy details</button><button class="btn" onclick="cm('+x+')">💬 Customer ko message</button><button class="btn" style="background:#b91c1c" onclick="dor('+x+')">🗑 Order delete</button></div>').join('')||'<p>Koi order nahi mila</p>'}
async function st(id,s,x){await sb.from('orders').update({status:s}).eq('id',id);O[x].status=s;alert('Status: '+s+'. Ab "Customer ko message" dabayein');rd()}
function csv(){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const rows=[['ID','Date','Naam','Phone','Shehar','Address','Items','Total','Profit','Status'],...O.map(o=>[o.id,(o.created_at||'').slice(0,10),o.name,o.phone,o.city,o.address,o.items.map(i=>i.title+' ('+i.size+' '+i.color+') x'+i.q).join('; '),o.total,o.total-o.items.reduce((a,i)=>a+i.cost*i.q,0),o.status])];
const b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='orders-'+new Date().toISOString().slice(0,10)+'.csv';a.click()}
async function dor(x){const o=O[x];if(!confirm('Order #'+o.id+' ('+o.name+') hamesha ke liye delete karein?\nProfit ka hisaab bhi is order ke baghair ghat jayega. Pehle CSV download kar lein.'))return;const{error}=await sb.from('orders').delete().eq('id',o.id);if(error)return alert(error.message);ord()}
async function clean(days){const cut=Date.now()-days*864e5,L=O.filter(o=>days?o.status=='Delivered'&&new Date(o.created_at)<cut:o.status=='Cancelled');
if(!L.length)return alert('Saaf karne ke liye kuch nahi hai');if(!confirm(L.length+' order hamesha ke liye delete honge ('+(days?'Delivered, '+days+' din se purane':'Cancelled')+').\nPehle 📥 CSV download kar lein. Aage barhein?'))return;
const{error}=await sb.from('orders').delete().in('id',L.map(o=>o.id));error?alert(error.message):(alert(L.length+' order saaf ho gaye ✅'),ord())}
function mk(k){document.querySelectorAll('.tabs button[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k==k));const b=document.querySelector('.tabs button.on');if(b&&b.scrollIntoView)b.scrollIntoView({inline:'center',block:'nearest'})}
function inst(){if(typeof dip!='undefined'&&dip)dip.prompt();else alert('Install prompt abhi nahi aaya.\nChrome ke ⋮ menu mein "Install app" ya "Add to Home screen" dhoondein.\nYa 🔧 Install check dabayein.')}
async function chk(){const ok=async u=>{try{return(await fetch(u,{cache:'no-store'})).ok}catch(e){return false}},r=[];
for(const u of ['admin.json','admin-192.png','admin-512.png','sw.js','manifest.json'])r.push(u+': '+(await ok(u)?'✅':'❌ upload nahi hui'));
const g=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();r.push('Service worker: '+(g?'✅':'❌'));
r.push('Install prompt: '+(typeof dip!='undefined'&&dip?'✅ aaya':'❌ abhi nahi aaya'));
r.push('Mode: '+(matchMedia('(display-mode: standalone)').matches?'App ke andar':'Browser mein'));alert(r.join('\n'))}
function ph92(p){p=p.replace(/\D/g,'');return p[0]=='0'?'92'+p.slice(1):p}
function cm(x){const o=O[x],it=o.items.map(i=>i.title+' ('+i.size+' '+i.color+') x'+i.q).join(', '),n=o.name,id=o.id,T=o.total,d=CFG.DELIVERY||'jald';
const M={New:'Assalam o Alaikum '+n+'! Aap ka order #'+id+' mil gaya hai: '+it+'. Total COD Rs '+T+'. Hum jald confirm karenge. Shukriya - '+CFG.STORE,
Confirmed:'Assalam o Alaikum '+n+'! Aap ka order #'+id+' confirm ho gaya hai: '+it+'. Total COD Rs '+T+'. Jald dispatch hoga. Shukriya - '+CFG.STORE,
Shipped:'Assalam o Alaikum '+n+'! Aap ka order #'+id+' dispatch ho gaya hai. Delivery '+d+' mein hogi. Rider ko Rs '+T+' tayyar rakhein. - '+CFG.STORE,
Delivered:'Shukriya '+n+'! Aap ka order #'+id+' deliver ho gaya hai. Product pasand aaye to dosto ko zaroor batayein. - '+CFG.STORE,
Cancelled:'Assalam o Alaikum '+n+', aap ka order #'+id+' cancel kar diya gaya hai. Dobara order ke liye hum hazir hain. - '+CFG.STORE};
open('https://wa.me/'+ph92(o.phone)+'?text='+encodeURIComponent(M[o.status]||M.New))}
function cp(x){const o=O[x];navigator.clipboard.writeText(o.name+'\n'+o.phone+'\n'+o.address+', '+o.city+'\n'+o.items.map(i=>i.title+' | '+i.size+' | '+i.color+' x'+i.q).join('\n')+'\nCOD: '+o.total).then(()=>alert('Copy ho gaya ✅'))}
function wa(x){const o=O[x];const t='Order #'+o.id+'\nNaam: '+o.name+'\nPhone: '+o.phone+'\nAddress: '+o.address+', '+o.city+'\n'+o.items.map(i=>i.title+' | '+i.size+' | '+i.color+' | Qty '+i.q).join('\n')+'\nCOD Amount: '+o.total;
open('https://wa.me/'+CFG.SUPPLIER+'?text='+encodeURIComponent(t))}
async function set(){mk('set');const{data,error}=await sb.from('settings').select('*');const S={};(data||[]).forEach(r=>S[r.k]=r.v);
$('#t').innerHTML='<div class="box"><h3>⚙️ Store Settings</h3>'+(error?'<p>Pehle update.sql Supabase mein chalayein.</p>':'')+'<label><small>Upar ki announcement bar (khali = nahi dikhegi)</small></label><input id="an" value="'+esc(S.announce)+'" placeholder="Winter Sale 🔥 Free Delivery!"><label><small>Banner ka bara likha</small></label><input id="ht" value="'+esc(S.hero_t)+'" placeholder="Naya Collection 🔥"><label><small>Banner ka chhota likha</small></label><input id="hp" value="'+esc(S.hero_p)+'" placeholder="Pasandeeda cheezein, ghar baithe mangwayein"><button class="btn" onclick="sv2()">💾 Save</button></div><div class="box"><h3>📲 Admin App</h3><button class="btn" style="background:#1f2430" onclick="inst()">📲 Admin app install karein</button><button class="btn" style="background:#475569" onclick="chk()">🔧 Install check</button></div>'}
async function sv2(){const v=i=>$(i).value.trim();const{error}=await sb.from('settings').upsert([{k:'announce',v:v('#an')},{k:'hero_t',v:v('#ht')},{k:'hero_p',v:v('#hp')}]);error?alert(error.message):alert('Save ho gaya ✅')}
</script></body></html>
